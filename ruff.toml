# Явний набір правил ruff для agents/scripts/.
#
# Без цього файлу набір активних правил залежить від встановленої версії
# ruff і від того, чи є десь вище по дереву чужий pyproject.toml/ruff.toml —
# check.sh на іншій машині міг би мовчки перевіряти інший (ширший чи вужчий)
# список правил, і сенс перевірки губився б. Тут набір зафіксований явно.

target-version = "py39"

[lint]
# E4/E7/E9 — стандартний pycodestyle-мінімум (imports, синтаксичні хиби);
# F — pyflakes, зокрема F821 undefined-name: саме він зловив реальний баг
# у проді, тому лишається обов'язково.
#
# Далі — повні родини, орієнтовані на баги й реальні дірки, а не на стиль:
# B (bugbear), S (bandit — небезпечні виклики: subprocess/urlopen/hardcoded
# secrets), SIM/RET/C4/PIE/PERF/UP/FLY (спрощення, що часто ховають чужу
# логічну помилку), DTZ (наївний datetime), EXE (шебанг-неузгодженість),
# FURB (застарілі API), ISC (неявна конкатенація рядків — легко пропустити
# кому), LOG/G (антипатерни логування), INT (printf-style форматування),
# TID (заборонені відносні імпорти), PGH (blanket noqa, eval тощо), A
# (тінявлення вбудованих імен). Виміряно: на agents/scripts/ це давало 36
# зауважень, усі розібрані по суті (subprocess/urlopen — чи торкається це
# зовнішнього вводу; B904 — реальна втрата причини помилки; решта —
# механічні й безпечні). Жодного зауваження не заглушено без причини.
#
# Свідомо НЕ ввімкнено цілими родинами: RUF001–003 (ambiguous-unicode)
# спрацьовує на кожному кириличному рядку — кодова база українською
# навмисно; D (докстрінги), ANN (анотації типів), PT (проєкт свідомо на
# unittest, не pytest), CPY/COM/EM/TRY003 — проти стилю, який тут
# навмисний, а не проти багів; E501 (довжина рядка) — 184 зауваження без
# жодного впійманого багу, чиста стилістика. RUF005/RUF059(loop)/TRY300 —
# теж стиль, не увімкнено. Повний PLW і TRY теж не вмикались — на цій базі
# вони або про архітектурний вибір (PLW0603 global — навмисне кешування),
# або суто стиль (TRY300); лише окремі коди з них реально ловлять баги —
# вони вибрані нижче поштучно.
select = [
    "E4", "E7", "E9", "F",
    "B", "S", "SIM", "RET", "C4", "PIE", "PERF", "UP", "DTZ", "EXE", "FURB",
    "ISC", "LOG", "G", "INT", "TID", "PGH", "FLY", "A",
    "PLW1510",  # subprocess.run без явного check=
    "PLW2901",  # for-змінна, перезаписана в тілі циклу — легко загубити оригінал
    "RUF059",   # розпакована змінна, яку ніде не використали — натяк на недописану логіку
    "RUF100",   # зайвий noqa
    "TRY004",   # ValueError там, де по суті TypeError
]
