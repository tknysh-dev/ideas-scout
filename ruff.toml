# Явний набір правил ruff для agents/scripts/.
#
# Без цього файлу набір активних правил залежить від встановленої версії
# ruff і від того, чи є десь вище по дереву чужий pyproject.toml/ruff.toml —
# check.sh на іншій машині міг би мовчки перевіряти інший (ширший чи вужчий)
# список правил, і сенс перевірки губився б. Тут набір зафіксований явно.

target-version = "py314"

[lint]
# E4/E7/E9 — стандартний pycodestyle-мінімум (imports, синтаксичні хиби);
# F — pyflakes, зокрема F821 undefined-name: саме він зловив реальний баг
# у проді, тому лишається обов'язково.
#
# Решта — точкові коди, а не цілі категорії (PLW/FURB/DTZ/EXE/RUF/TRY), бо
# повне вмикання цих родин на цій кодовій базі тоне в шумі: RUF001–003
# (ambiguous-unicode) спрацьовує на кожному кириличному рядку — а тут вся
# кодова база українською навмисно; TRY003 хоче кастомних класів винятків
# там, де проєкт свідомо кидає прості ValueError/TypeError з людським
# українським текстом. Перелічені нижче коди — саме ті, що реально
# спрацювали при першому прогоні ruff і були розібрані по суті:
select = [
    "E4", "E7", "E9", "F",
    "PLW1510",  # subprocess.run без явного check=
    "FURB167",  # re.S/re.I замість re.DOTALL/re.IGNORECASE
    "DTZ005",   # datetime.now() без tzinfo
    "EXE001",   # shebang у файлі, який не запускають напряму
    "RUF100",   # зайвий noqa
    "TRY004",   # ValueError там, де по суті TypeError
]
